services:
  go-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-server:local
    container_name: go-server
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: "docker-local"
      APP_VERSION: "0.1.0"
      SHUTDOWN_TIMEOUT: "10s"
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
